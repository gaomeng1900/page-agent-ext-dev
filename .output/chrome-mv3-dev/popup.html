<script src="http://localhost:3001/@id/virtual:wxt-html-plugins" type="module"></script>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Page Agent Extension</title>
		<style>
			body {
				width: 320px;
				min-height: 200px;
				padding: 20px;
				font-family: system-ui, -apple-system, sans-serif;
				margin: 0;
			}

			h2 {
				margin: 0 0 16px 0;
				font-size: 18px;
				color: #333;
			}

			.key-container {
				background: #f5f5f5;
				padding: 12px;
				border-radius: 6px;
				margin-bottom: 16px;
			}

			.key-label {
				font-size: 12px;
				color: #666;
				margin-bottom: 6px;
			}

			.key-value {
				font-family: 'Monaco', 'Menlo', monospace;
				font-size: 11px;
				word-break: break-all;
				color: #0066cc;
				background: white;
				padding: 8px;
				border-radius: 4px;
				border: 1px solid #ddd;
			}

			.actions {
				display: flex;
				gap: 8px;
				margin-bottom: 16px;
			}

			button {
				flex: 1;
				padding: 8px 16px;
				font-size: 13px;
				cursor: pointer;
				border: none;
				border-radius: 4px;
				font-weight: 500;
			}

			.btn-primary {
				background: #0066cc;
				color: white;
			}

			.btn-primary:hover {
				background: #0052a3;
			}

			.btn-secondary {
				background: #e0e0e0;
				color: #333;
			}

			.btn-secondary:hover {
				background: #d0d0d0;
			}

			.status {
				margin-top: 12px;
				padding: 8px;
				border-radius: 4px;
				font-size: 12px;
				display: none;
			}

			.status.success {
				background: #d4edda;
				color: #155724;
				display: block;
			}

			.status.error {
				background: #f8d7da;
				color: #721c24;
				display: block;
			}

			.description {
				font-size: 13px;
				color: #666;
				margin-bottom: 16px;
				line-height: 1.5;
			}

			.divider {
				height: 1px;
				background: #e0e0e0;
				margin: 16px 0;
			}

			.agent-section {
				margin-top: 12px;
			}

			.agent-section h3 {
				font-size: 14px;
				margin: 0 0 8px 0;
				color: #333;
			}

			.btn-agent {
				width: 100%;
				padding: 10px 16px;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				border-radius: 6px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				transition: transform 0.2s;
			}

			.btn-agent:hover {
				transform: translateY(-1px);
				box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
			}

		<h2>🔐 Page Agent Extension</h2>

		<div class="description">
			复制下面的 Key，在控制页面中调用
			<code>pageAgentExtension.link(key)</code> 进行认证。
		</div>

		<div class="key-container">
			<div class="key-label">API Key</div>
			<div class="key-value" id="apiKey">Loading...</div>
		</div>

		<div class="actions">
			<button class="btn-primary" id="copyBtn">复制 Key</button>
			<button class="btn-secondary" id="refreshBtn">刷新 Key</button>
		</div>

		<div class="divider"></div>

		<div class="agent-section">
			<h3>🤖 AI Agent</h3>
			<button class="btn-agent" id="openAgentBtn">
				打开 Agent 控制面板
			</button>
		</div>

		<div class="status" id="status"></div>

		<script src="http://localhost:3001/entrypoints/popup/main.js" type="module"></script>
	</body>
</html>
